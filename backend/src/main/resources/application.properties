spring.application.name=SignatureTrips

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/signaturetrips
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Business rules
roteiro.max-atividades-por-dia=5
