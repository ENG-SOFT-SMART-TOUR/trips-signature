spring.application.name=SignatureTrips

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:signaturetrips}
spring.datasource.username=${PGUSER:signaturetrips}
spring.datasource.password=${PGPASSWORD:signaturetrips}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Business rules
roteiro.max-atividades-por-dia=5
