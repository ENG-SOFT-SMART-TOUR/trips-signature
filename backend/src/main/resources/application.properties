spring.application.name=SignatureTrips

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/signaturetrips
spring.datasource.username=signaturetrips
spring.datasource.password=signaturetrips

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE
